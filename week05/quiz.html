<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maggie McCausland | WDD 130</title>
    <meta name="description" content="W05 Code-along Activity: Quiz Form">
    <meta name="author" content="Maggie McCausland">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Basic Quiz Form</title>
</head>

<body>
    <header>
        <h1>W05 Code-along Activity: Quiz Form</h1>
    </header>
    <main class="box">
        <h1>✅ Basic HTML and CSS Quiz</h1>

        <form action="">
            <div class="quiz-item box">
                <label>1. What does the acronym CSS stand for?
                    <input type="text" id="q1" name="q1" required>
                </label>
            </div>

            <div class="quiz-item box">
                <label>2. How are id and class attributes selected in CSS?
                    <textarea type="text" id="q2" name="q2" required></textarea>
                </label>
            </div>

            <div class="quiz-item box">
                <label>3. Which of the following is a valid CSS comment?
                    <select id="q3" name="q3" required>
                        <option value="" selected disabled>Choose One...</option>
                        <option value="a">A. &lt;!-- This is a comment --&gt</option>
                        <option value="b">B. /* This is a comment */</option>
                        <option value="c">C. // This is a comment</option>
                    </select>
                </label>
            </div>

            <div class="quiz-item box">
                <label>4. What is the bottom margin given this declaration?
                    <code class="box">margin: 10px 5px 15px;</code>
                    <input type="number" id="q4" name="q4" required>
                </label>
            </div>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>

    <footer>
        <p>©2026 | Maggie McCausland | Springville, Utah</p>
    </footer>
</body>
