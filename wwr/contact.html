<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This will be the contact page for white water rafting for course WDD 130.">
    <meta name="author" content="Maggie McCausland">
    <title>Contact Us: Splash</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="white water rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Splash: White Water Rafting</h1>
            <h2>1085 E Provo Canyon Rd</h2>
            <h2>Orem, Utah</h2>
            <h2>+1 999 786 5432</h2>
            <h2>info@splashrafting.com</h2>
        </section>

        <section class="map-form">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2001.973721228174!2d-111.64562514631993!3d40.32466380092189!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1785450854493!5m2!1sen!2sus"
              allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <div class="form-item column2">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <div class="form-item options">
                    <h3>Message Purpose</h3>
                    <div class="options">
                        <div>
                            <input type="radio" id="general" name="purpose" value="general"
                              required>
                            <label for="general">General Inquiry</label>
                        </div>

                        <div>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>

                        <div>
                            <input type="radio" id="website" name="purpose" value="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </div>
                </div>

                <div class="form-item">
                    <label for="feedback">Message</label>
                    <textarea id="feedback" name="feedback" rows="4" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="form-item subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe" value="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly
                        newsletter</label>
                </div>

                <button type="submit">Get In Touch!</button>

            </form>
        </section>


        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/sam.jpg" alt="Photo of Sam by Terry Scott on Unsplash">
                <figcaption>Founder: Sam</figcaption>
            </figure>
            <figure>
                <img src="images/marcus.jpg" alt="Photo of Marcus by Leeder Bose on Unsplash">
                <figcaption>Guide: Marcus</figcaption>
            </figure>
            <figure>
                <img src="images/jenna.jpg" alt="Photo of Jenna by Aleksandar Andreev on Unsplash">
                <figcaption>Guide: Jenna</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>©2026 | Splash | Maggie McCausland</p>
        <nav class="socialmedia">
            <a href="facebook.com"><img src="images/facebook.png"
                  alt="Facebook Icon by Freepik on Magnific"></a>
            <a href="linkedin.com"><img src="images/linkedin.png"
                  alt="LinkedIn Icon by Freepik on Magnific"></a>
            <a href="instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon by Freepik on Magnific"></a>
        </nav>
    </footer>
</body>

</html>
