<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This will be the home page for white water rafting for course WDD 130.">
    <meta name="author" content="Maggie McCausland">
    <title>Home: Splash</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="white water rafting logo">
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero alternate-hero">
            <img src="images/home-hero.jpg" alt="river rafting group hero image">
            <h1>Splash: White Water Rafting</h1>
            <p>Time to Make Memories!</p>
        </div>

        <form class="signup-form">
            <div>
                <h2>Would you like to be in the know?</h2>
                <p>You can subscribe to our monthly newsletter so you can get the latest deals and
                    information!</p>
            </div>

            <div class="form-item column2">
                <label for="fullname">Name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-item column2">
                <label for="useremail">Email</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>

            <button type="submit">Sign Me Up!</button>

        </form>
    </main>

    <footer>
        <p>©2026 💦 Splash 💦 Maggie McCausland</p>
        <nav class="socialmedia">
            <a href="facebook.com"><img src="images/facebook.png"
                  alt="Facebook Icon by Freepik on Magnific"></a>
            <a href="linkedin.com"><img src="images/linkedin.png"
                  alt="LinkedIn Icon by Freepik on Magnific"></a>
            <a href="instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon by Freepik on Magnific"></a>
        </nav>
    </footer>
</body>

</html>
